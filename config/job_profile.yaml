# Job Radar configuration
#
# Defines the job profile used to evaluate scraped vacancies.
#
# tags: Job titles or title phrases used during the title filtering stage.
# keywords: Keywords searched within the job description to compute a relevance score.
#
# All entries should be written in plain English. Common abbreviations
# (e.g. AI, ML, R&D, FDA, SaMD) are expanded during normalization.

